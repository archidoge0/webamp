name: "ghav human: CI"
"on":
  push:
    branches:
      - ghav/dev/1302
    paths:
      - .ghav/human
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate cache key
        id: cache-key
        run: echo "key=node-modules-${{ hashFiles('**/yarn.lock') }}" >> $GITHUB_OUTPUT
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: |
          # Set CI environment variable for optimized builds
          export CI=true
          yarn workspace ani-cursor build
          yarn workspace webamp build
          yarn workspace webamp build-library
        env:
          NODE_ENV: production
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/built
            packages/*/dist
          key: build-artifacts-${{ github.sha }}
  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: |
          yarn lint
          yarn workspace webamp type-check
  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Run Unit Tests
        run: |
          touch packages/skin-database/config.js
          # Run tests with optimizations for CI
          export CI=true
          yarn test --maxWorkers=2
          yarn workspace webamp test --maxWorkers=2
        env:
          NODE_ENV: test
  main-release:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs:
      - build
      - lint
      - test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org/
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Restore build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/built
            packages/*/dist
          key: build-artifacts-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Set version
        if: github.ref == 'refs/heads/master'
        run: |
          echo "Setting version to 0.0.0-next-${RELEASE_COMMIT_SHA::7}"
          yarn workspace webamp version --new-version 0.0.0-next-${RELEASE_COMMIT_SHA::7} --no-git-tag-version
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - name: Build release version
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: exit 1
